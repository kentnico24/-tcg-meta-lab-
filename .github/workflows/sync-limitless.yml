
name: Sync Limitless Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Fetch Limitless data
        run: python limitless_sync.py

      - name: Export matches to CSV
        run: python export_matches.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f matches_snapshot.csv ]; then
            echo "::error::matches_snapshot.csv was not created"
            exit 1
          fi

          git add matches_snapshot.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Limitless match data"
            git push
          fi
