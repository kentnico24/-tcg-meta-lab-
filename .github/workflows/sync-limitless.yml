
name: Sync Limitless Data

on:
  workflow_dispatch:
  # Execute one live verification after workflow improvements are merged.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-limitless.yml'
  schedule:
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: limitless-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Fetch Limitless data
        run: python limitless_sync.py --since 2026-09-01 --recent-pages 1 --pages 30 --max-tournaments 90 --max-seconds 1200 --caught-up-refresh 25

      - name: Export matches to CSV
        run: python export_matches.py

      - name: Export player-country annotations
        run: python export_countries.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f matches_snapshot.csv ]; then
            echo "::error::matches_snapshot.csv was not created"
            exit 1
          fi

          git add matches_snapshot.csv match_countries.csv sync_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Limitless match data"
            # City League syncs and source-code merges can advance main while
            # the lengthy Limitless fetch is running. Rebase on those commits
            # rather than discarding successfully collected match data.
            for attempt in 1 2 3; do
              git pull --rebase
              if git push; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error::Failed to push cumulative match data after retries"
            exit 1
          fi
