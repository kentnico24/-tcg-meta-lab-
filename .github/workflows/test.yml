name: Python checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app.py limitless_sync.py export_matches.py snapshot_store.py deck_names.py tests
      - run: python -m unittest discover -s tests -v
